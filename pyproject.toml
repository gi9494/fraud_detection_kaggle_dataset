[project]
name = "fraud-detection"
version = "0.1.0"
description = "Card fraud detection built like a bank would run it: time split, money-based metrics, rules baseline, explaining agent"
requires-python = ">=3.11"
dependencies = [
    # data and charts
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",        # Parquet: fast reading of the data
    "matplotlib>=3.8",
    # models
    "scikit-learn>=1.5",
    "catboost>=1.2",      # only for the comparison in notebook 03
    "joblib>=1.3",
    # agent
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud"]