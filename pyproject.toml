[project]
name = "fraud-console"
version = "0.1.0"
description = "Card fraud detection built like a bank would run it: money-based metrics, time splits, analyst console"
requires-python = ">=3.11"
dependencies = [
    # step 1: exploration
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",        # Parquet: fast reading of the data
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud"]